[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oneopen-broker"
version = "0.1.0"
description = "A lightweight, Python-native, single-node message broker with first-class Celery support, durable task queues, Pub/Sub and built-in monitoring."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "OneOpen" }]
keywords = ["broker", "celery", "kombu", "pubsub", "queue", "asyncio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
celery = [
    "kombu>=5.3",
    "celery>=5.3",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
]

[project.scripts]
oneopen-broker = "oneopen_broker.cli.main:main"

[project.urls]
Homepage = "https://github.com/1-OpenSource/OneOpen-Broker"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "celery: tests that require the celery extra",
    "stress: longer-running stress tests",
]
timeout = 60

[tool.ruff]
line-length = 100
target-version = "py311"
